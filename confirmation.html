<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed — Fruitlee Beverages LTD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="checkpoint-topbar">
      <a href="index.html" aria-label="Fruitlee home">
        <img class="checkpoint-logo" src="IMAGES/fruitlee-logo.png" alt="Fruitlee" />
      </a>
    </div>

    <main>
      <div class="checkpoint-wrap confirmation-wrap">
        <span class="confirmation-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7" />
          </svg>
        </span>
        <p class="eyebrow" style="color: var(--leaf)">Order received</p>
        <h1>Thanks — your juice is on its way.</h1>
        <p id="confirmationSub" class="checkpoint-note"></p>

        <div id="confirmationSummary" class="order-summary"></div>

        <div class="notice-card notice-delivery">
          <span class="notice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="18" r="2.2" />
              <circle cx="18" cy="18" r="2.2" />
              <path d="M8 18h6.5" />
              <path d="M8 18l1.5-6h4l2 4h2.5" />
              <path d="M9.5 12h4" />
              <path d="M15.5 8.5h2.5" />
            </svg>
          </span>
          <p>
            We're arranging your <strong>Yango</strong> delivery now. It
            should arrive within <strong>5 hours</strong> — we'll be in
            touch with the driver's details.
          </p>
        </div>

        <div class="notice-card notice-payment" id="paymentNotice">
          <span class="notice-icon" id="paymentNoticeIcon"></span>
          <p id="paymentNoticeText"></p>
        </div>

        <div class="checkpoint-actions">
          <a href="index.html#juices" class="btn">Back to Menu</a>
        </div>
      </div>
    </main>

    <script>
      (() => {
        let order = null;
        try {
          order = JSON.parse(localStorage.getItem("fruitleeLastOrder"));
        } catch {
          order = null;
        }

        const sub = document.getElementById("confirmationSub");
        const summaryEl = document.getElementById("confirmationSummary");

        if (!order) {
          sub.textContent = "";
          summaryEl.innerHTML = `
            <div class="order-summary-empty">
              We couldn't find a recent order — if you just placed one, check your email/phone for confirmation.
            </div>
          `;
          return;
        }

        sub.textContent = `We've got your order, ${order.customer.name}. Here's what you ordered:`;

        const rows = order.items
          .map(
            (item) => `
              <div class="order-summary-row">
                <span>${item.qty}× ${item.product} <em>(${item.size})</em></span>
                <span>GH₵${item.price * item.qty}</span>
              </div>
            `
          )
          .join("");

        summaryEl.innerHTML = `
          ${rows}
          <div class="order-summary-row order-summary-total">
            <span>Subtotal</span>
            <span>GH₵${order.subtotal}</span>
          </div>
        `;

        // ---- Payment-method-aware notice ----
        const paymentNoticeIcon = document.getElementById("paymentNoticeIcon");
        const paymentNoticeText = document.getElementById("paymentNoticeText");

        const momoIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M10.5 18.5h3" /></svg>`;
        const phoneIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4h2.7l1.4 4.2-1.9 1.6a11.5 11.5 0 0 0 5.5 5.5l1.6-1.9 4.2 1.4v2.7c0 1.1-.9 2-2 2C10.5 19.5 4.5 13.5 4.5 6c0-1.1.9-2 2-2Z" /></svg>`;

        if (order.paymentMethod === "momo") {
          paymentNoticeIcon.innerHTML = momoIcon;
          paymentNoticeText.innerHTML = `
            You'll receive a <strong>Mobile Money</strong> payment prompt on
            your phone shortly to complete payment for your juice. The
            <strong>Yango</strong> delivery fee is still paid to the driver
            on arrival.
          `;
          // TODO: once Paystack is wired up, this section should reflect the
          // real payment status (e.g. "Payment received" vs "Payment pending")
          // instead of always showing this generic message.
        } else {
          paymentNoticeIcon.innerHTML = phoneIcon;
          paymentNoticeText.innerHTML = `
            Please expect a <strong>call from us within the next 30
            minutes</strong> to confirm your order. Have the juice cost ready
            for <strong>Fruitlee</strong> and the delivery fee ready for the
            <strong>Yango driver</strong> — cash or Mobile Money, paid
            separately on arrival.
          `;
        }
      })();
    </script>
  </body>
</html>
